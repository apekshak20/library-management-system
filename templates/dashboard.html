{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}
{% block heading %}Dashboard{% endblock %}

{% block content %}
<div class="row g-4 mb-4">
    <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-indigo"><i class="bi bi-journal-bookmark"></i></div>
            <div>
                <div class="stat-label">Total Books</div>
                <div class="stat-value">0</div>
            </div>
        </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-green"><i class="bi bi-people"></i></div>
            <div>
                <div class="stat-label">Registered Students</div>
                <div class="stat-value">0</div>
            </div>
        </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-orange"><i class="bi bi-box-arrow-up-right"></i></div>
            <div>
                <div class="stat-label">Currently Issued</div>
                <div class="stat-value">0</div>
            </div>
        </div>
    </div>
    <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
            <div class="stat-icon bg-blue"><i class="bi bi-check2-circle"></i></div>
            <div>
                <div class="stat-label">Available Books</div>
                <div class="stat-value">0</div>
            </div>
        </div>
    </div>
</div>

<div class="panel">
    <div class="panel-header">
        <h6 class="mb-0">Recent Transactions</h6>
    </div>
    <div class="panel-body text-muted">
        Real data will appear here in Stage 10.
    </div>
</div>
{% endblock %}
